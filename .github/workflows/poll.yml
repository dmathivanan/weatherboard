name: poll

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: poll
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests python-dotenv

      - name: Run poller
        env:
          AMBIENT_APP_KEY: ${{ secrets.AMBIENT_APP_KEY }}
          AMBIENT_API_KEY: ${{ secrets.AMBIENT_API_KEY }}
          FLOODBOARD_CONTACT: ${{ secrets.FLOODBOARD_CONTACT }}
          SUMP_URL: ${{ secrets.SUMP_URL }}
          PUSHOVER_TOKEN: ${{ secrets.PUSHOVER_TOKEN }}
          PUSHOVER_USER: ${{ secrets.PUSHOVER_USER }}
        run: python poller.py

      - name: Commit data
        run: |
          git config user.name "floodboard-bot"
          git config user.email "bot@users.noreply.github.com"
          git add docs/data
          git commit -m "data $(date -u +%Y-%m-%dT%H:%M)" || echo "nothing to commit"
          git pull --rebase
          git push
